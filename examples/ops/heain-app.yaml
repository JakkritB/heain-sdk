# ops-app: submits jobs, asks P5, broadcasts (P7) and journals -- heain-sdk step 3c example.
manifest_version: 1
app:
  id: ops-app
  version: 1.0.0
  group: domain
  api: v1
  sdk: {name: heain-sdk-go, version: ">=1.0.0"}
capabilities:
  - {name: ops.run, version: 1, formal: false, execution: job, ai: {used: false}}
uses:
  - app: worker-app
    capabilities: [text.upper, text.tone]
