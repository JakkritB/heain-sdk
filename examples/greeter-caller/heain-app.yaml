# greeter-caller: calls greeter-app through the SDK (step 3b example).
manifest_version: 1
app:
  id: greeter-caller
  version: 1.0.0
  group: domain
  api: v1
  sdk: {name: heain-sdk-go, version: ">=1.0.0"}
capabilities:
  - {name: caller.run, version: 1, formal: false, execution: job, ai: {used: false}}
uses:
  - app: greeter-app
    capabilities: [greet.hello, greet.tone, greet.id, greet.ballot]
