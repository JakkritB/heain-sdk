# greeter-app: the example server for heain-sdk step 3b.
manifest_version: 1
app:
  id: greeter-app
  version: 1.0.0
  group: domain
  description: Greets people, classifies the tone of a message, and shows lanes.
  api: v1
  sdk: {name: heain-sdk-go, version: ">=1.0.0"}
capabilities:
  - name: greet.hello
    version: 1
    formal: true
    execution: direct
    ai: {used: false}
  - name: greet.tone
    version: 1
    formal: true
    execution: direct
    ai:
      used: true
      model: {name: tone-rules, version: "1"}
      reasoning_record: required
  - name: greet.id
    version: 1
    formal: true
    execution: direct
    lane: identity
    ai: {used: false}
  - name: greet.ballot
    version: 1
    formal: true
    execution: direct
    lane: ballot
    ai: {used: false}
endpoints:
  - {method: POST, path: /v1/hello, capability: greet.hello, formal: true}
  - {method: GET, path: "/v1/hello/{name}", capability: greet.hello, formal: false}
  - {method: POST, path: /v1/tone, capability: greet.tone, formal: true}
  # deliberately broken: answers without a reasoning record (live test)
  - {method: POST, path: /v1/tone-unrecorded, capability: greet.tone, formal: true}
  - {method: POST, path: /v1/id, capability: greet.id, formal: true}
  - {method: POST, path: /v1/ballot, capability: greet.ballot, formal: true}
lanes:
  unlinkable: [[identity, ballot]]
