manifest_version: 1
app:
  id: hello-app
  version: 1.0.0
  group: domain
  api: v1
  sdk: { name: heain-sdk-go, version: ">=1.0.0 <2.0.0" }
capabilities:
  - name: hello.greet
    version: 1
    formal: true
    execution: direct
    ai: { used: false }
endpoints:
  - { method: POST, path: /v1/greet, capability: hello.greet, formal: true }
  - { method: GET, path: "/v1/greet/{id}", capability: hello.greet, formal: false }
